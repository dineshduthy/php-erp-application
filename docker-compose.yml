services:

  php:
    build:
      context:.
      dockerfile: Dockerfile

    image: php-erp-application:latest

    container_name: php-app

    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - .:/var/www/html

    depends_on:
      - mysql

  nginx:

    build:
      context: .
      dockerfile: Dockerfile.nginx

    image: php-erp-nginx:latest

    container_name: nginx-web

    restart: unless-stopped

    ports:
      - "9090:80"

    volumes:
      - .:/var/www/html

    depends_on:
      - php

  mysql:

    image: mysql:8.0

    container_name: mysqlserver

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: Test@123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./testdb.sql:/docker-entrypoint-initdb.d/testdb.sql:ro

volumes:
  mysql_data:
